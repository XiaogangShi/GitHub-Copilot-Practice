<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子烟花模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2a, #1a1a4a);
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 70vh;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 255, 0.3);
            margin-bottom: 20px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a2a;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: rgba(0, 0, 30, 0.7);
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(to right, #4a00e0, #8e2de2);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(142, 45, 226, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(142, 45, 226, 0.8);
        }

        button:active {
            transform: translateY(1px);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 120px;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            max-width: 600px;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .slider-container {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <header>
        <h1>电子烟花模拟器</h1>
        <p class="subtitle">点击画面或使用控制面板发射烟花</p>
    </header>

    <div class="container">
        <div class="canvas-container">
            <canvas id="fireworksCanvas"></canvas>
        </div>

        <div class="controls">
            <button id="launchBtn">发射烟花</button>
            <button id="autoLaunchBtn">自动发射</button>
            <button id="clearBtn">清除所有</button>

            <div class="slider-container">
                <label for="fireworkType">烟花类型:</label>
                <select id="fireworkType">
                    <option value="random">随机</option>
                    <option value="spherical">球形</option>
                    <option value="willow">柳树形</option>
                    <option value="palm">棕榈形</option>
                    <option value="ring">环形</option>
                    <option value="heart">心形</option>
                </select>
            </div>

            <div class="slider-container">
                <label for="intensity">烟花强度:</label>
                <input type="range" id="intensity" min="1" max="10" value="5">
            </div>

            <div class="slider-container">
                <label for="frequency">发射频率:</label>
                <input type="range" id="frequency" min="1" max="10" value="5">
            </div>
        </div>

        <div class="info">
            <p>点击画面上任意位置发射烟花 | 使用控制面板调整烟花效果 | 按空格键快速发射</p>
        </div>
    </div>

    <script>
        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                // 随机大小和位置
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                // 随机闪烁延迟
                star.style.animationDelay = `${Math.random() * 5}s`;

                starsContainer.appendChild(star);
            }
        }

        // 烟花模拟器
        class FireworksSimulator {
            constructor() {
                this.canvas = document.getElementById('fireworksCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.fireworks = [];
                this.particles = [];
                this.autoLaunch = false;
                this.autoLaunchInterval = null;

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // 事件监听
                this.canvas.addEventListener('click', (e) => this.launchFirework(e));
                document.getElementById('launchBtn').addEventListener('click', () => this.launchRandomFirework());
                document.getElementById('autoLaunchBtn').addEventListener('click', () => this.toggleAutoLaunch());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearAll());
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.launchRandomFirework();
                    }
                });

                // 初始化
                this.animate();
                createStars();
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            }

            launchFirework(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const fireworkType = document.getElementById('fireworkType').value;
                const intensity = parseInt(document.getElementById('intensity').value);

                this.createFirework(x, y, fireworkType, intensity);
            }

            launchRandomFirework() {
                const x = Math.random() * this.canvas.width;
                const y = Math.random() * this.canvas.height * 0.7;

                const fireworkType = document.getElementById('fireworkType').value;
                const intensity = parseInt(document.getElementById('intensity').value);

                this.createFirework(x, y, fireworkType, intensity);
            }

            createFirework(x, y, type = 'random', intensity = 5) {
                // 如果类型是随机，则随机选择一种
                if (type === 'random') {
                    const types = ['spherical', 'willow', 'palm', 'ring', 'heart'];
                    type = types[Math.floor(Math.random() * types.length)];
                }

                // 创建烟花
                const firework = {
                    x: x,
                    y: this.canvas.height, // 从底部发射
                    targetX: x,
                    targetY: y,
                    speed: 5 + Math.random() * 3,
                    size: 3,
                    color: this.getRandomColor(),
                    trail: [],
                    exploded: false
                };

                this.fireworks.push(firework);

                // 设置爆炸函数
                firework.explode = () => {
                    this.explodeFirework(firework, type, intensity);
                    firework.exploded = true;
                };
            }

            explodeFirework(firework, type, intensity) {
                const particleCount = 50 + intensity * 20;
                const power = 2 + intensity * 0.5;

                for (let i = 0; i < particleCount; i++) {
                    let vx, vy;

                    // 根据烟花类型设置粒子运动模式
                    switch(type) {
                        case 'spherical':
                            // 球形爆炸
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * power;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;

                        case 'willow':
                            // 柳树形 - 向下垂落
                            const angle2 = Math.random() * Math.PI * 0.5 + Math.PI * 0.25;
                            const speed2 = Math.random() * power;
                            vx = Math.cos(angle2) * speed2;
                            vy = Math.sin(angle2) * speed2;
                            break;

                        case 'palm':
                            // 棕榈形 - 向上扩散
                            const angle3 = Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                            const speed3 = Math.random() * power;
                            vx = Math.cos(angle3) * speed3;
                            vy = Math.sin(angle3) * speed3;
                            break;

                        case 'ring':
                            // 环形
                            const angle4 = (i / particleCount) * Math.PI * 2;
                            const speed4 = power;
                            vx = Math.cos(angle4) * speed4;
                            vy = Math.sin(angle4) * speed4;
                            break;

                        case 'heart':
                            // 心形
                            const t = (i / particleCount) * Math.PI * 2;
                            const x = 16 * Math.pow(Math.sin(t), 3);
                            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                            vx = x * 0.1 * power;
                            vy = -y * 0.1 * power;
                            break;

                        default:
                            const angle5 = Math.random() * Math.PI * 2;
                            const speed5 = Math.random() * power;
                            vx = Math.cos(angle5) * speed5;
                            vy = Math.sin(angle5) * speed5;
                    }

                    const particle = {
                        x: firework.x,
                        y: firework.y,
                        vx: vx,
                        vy: vy,
                        size: 2 + Math.random() * 3,
                        color: this.getRandomColor(),
                        life: 100 + Math.random() * 50,
                        gravity: 0.05,
                        resistance: 0.98,
                        alpha: 1
                    };

                    this.particles.push(particle);
                }
            }

            getRandomColor() {
                const colors = [
                    '#FF5252', '#FF4081', '#E040FB', '#7C4DFF',
                    '#536DFE', '#448AFF', '#40C4FF', '#18FFFF',
                    '#64FFDA', '#69F0AE', '#B2FF59', '#EEFF41',
                    '#FFFF00', '#FFD740', '#FFAB40', '#FF6E40'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            updateFireworks() {
                // 更新烟花
                for (let i = this.fireworks.length - 1; i >= 0; i--) {
                    const firework = this.fireworks[i];

                    if (!firework.exploded) {
                        // 记录轨迹
                        firework.trail.push({x: firework.x, y: firework.y});
                        if (firework.trail.length > 10) {
                            firework.trail.shift();
                        }

                        // 移动烟花
                        const dx = firework.targetX - firework.x;
                        const dy = firework.targetY - firework.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 5) {
                            firework.explode();
                        } else {
                            firework.x += (dx / distance) * firework.speed;
                            firework.y += (dy / distance) * firework.speed;
                        }
                    } else {
                        // 移除已爆炸的烟花
                        this.fireworks.splice(i, 1);
                    }
                }

                // 更新粒子
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];

                    p.vx *= p.resistance;
                    p.vy *= p.resistance;
                    p.vy += p.gravity;

                    p.x += p.vx;
                    p.y += p.vy;

                    p.life--;
                    p.alpha = p.life / 100;

                    if (p.life <= 0 || p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw() {
                // 清除画布，使用半透明黑色创造拖尾效果
                this.ctx.fillStyle = 'rgba(10, 10, 42, 0.2)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制烟花轨迹
                for (const firework of this.fireworks) {
                    if (!firework.exploded) {
                        // 绘制轨迹
                        for (let i = 0; i < firework.trail.length; i++) {
                            const point = firework.trail[i];
                            const alpha = i / firework.trail.length;

                            this.ctx.beginPath();
                            this.ctx.arc(point.x, point.y, firework.size * alpha, 0, Math.PI * 2);
                            this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                            this.ctx.fill();
                        }

                        // 绘制烟花头
                        this.ctx.beginPath();
                        this.ctx.arc(firework.x, firework.y, firework.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = firework.color;
                        this.ctx.fill();
                    }
                }

                // 绘制粒子
                for (const p of this.particles) {
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color.replace(')', `, ${p.alpha})`).replace('rgb', 'rgba');
                    this.ctx.fill();
                }
            }

            animate() {
                this.updateFireworks();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }

            toggleAutoLaunch() {
                this.autoLaunch = !this.autoLaunch;
                const btn = document.getElementById('autoLaunchBtn');

                if (this.autoLaunch) {
                    btn.textContent = '停止自动发射';
                    const frequency = parseInt(document.getElementById('frequency').value);
                    const interval = 1100 - frequency * 100; // 100ms 到 1000ms

                    this.autoLaunchInterval = setInterval(() => {
                        this.launchRandomFirework();
                    }, interval);
                } else {
                    btn.textContent = '自动发射';
                    if (this.autoLaunchInterval) {
                        clearInterval(this.autoLaunchInterval);
                    }
                }
            }

            clearAll() {
                this.fireworks = [];
                this.particles = [];
            }
        }

        // 初始化烟花模拟器
        document.addEventListener('DOMContentLoaded', () => {
            new FireworksSimulator();

            // 更新频率控制
            const frequencySlider = document.getElementById('frequency');
            frequencySlider.addEventListener('input', () => {
                // 如果自动发射开启，则重新设置间隔
                const simulator = window.fireworksSimulator;
                if (simulator && simulator.autoLaunch) {
                    simulator.toggleAutoLaunch(); // 先停止
                    simulator.toggleAutoLaunch(); // 再以新频率开始
                }
            });
        });

        // 将模拟器实例保存到全局变量，以便频率控制可以访问
        window.fireworksSimulator = null;
        window.addEventListener('DOMContentLoaded', () => {
            window.fireworksSimulator = new FireworksSimulator();
        });
    </script>
</body>
</html>
